# Деплой сайта в Yandex Object Storage на каждый push в main.
# Пока в репозитории не заданы ключи, workflow ничего не делает и не падает.
# Настройка — deploy/yandex/README.md

name: Деплой в Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yandex
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEYS: ${{ secrets.YC_S3_KEY_ID != '' && secrets.YC_S3_SECRET != '' }}
      BUCKET: ${{ vars.YC_BUCKET || 'www.grabyou.ru' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.grabyou.ru' }}
      PARTNER_API_URL: ${{ vars.PARTNER_API_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      # свежий AWS CLI шлёт контрольные суммы, которые Object Storage не принимает
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Ключи не заданы — пропускаем
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::Секреты YC_S3_KEY_ID / YC_S3_SECRET не заданы — деплой в Yandex Cloud пропущен. См. deploy/yandex/README.md"

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_KEYS == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Сборка
        if: env.HAS_KEYS == 'true'
        run: |
          if [ -z "$PARTNER_API_URL" ]; then
            echo "::warning::Не задана переменная PARTNER_API_URL — форма «Партнёрам» не будет отправлять заявки"
          fi
          npm ci
          npm run build

      - name: Выкладка в Object Storage
        if: env.HAS_KEYS == 'true'
        run: bash deploy/yandex/upload.sh build
